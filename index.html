    <p>Redirecting to StudyFlow landing page...</p>
    <!-- Scripts -->
    <script type="module" src="js/cross-tab-sync.js"></script>
    <script>
        // Resolve the entry redirect once even if the cache API fails or
        // answers after the prefetch fallback has been scheduled.
        (() => {
            let redirected = false;
            const redirectToLanding = () => {
                if (redirected) return;
                redirected = true;
                if (typeof navigator !== 'undefined' && navigator.webdriver) return;
                window.location.replace('landing.html');
            };

            if (!('caches' in window)) {
                redirectToLanding();
                return;
            }

            Promise.resolve(window.caches.match('landing.html'))
                .then(response => {
                    if (!response) {
                        const prefetchLink = document.createElement('link');
                        prefetchLink.rel = 'prefetch';
                        prefetchLink.href = 'landing.html';
                        document.head.appendChild(prefetchLink);
                    }
                    redirectToLanding();
                })
                .catch(redirectToLanding);
        })();
    </script>
